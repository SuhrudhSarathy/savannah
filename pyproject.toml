[project]
name = "savannah"
version = "0.1.0"
description = "Robot Learning models in the wild"
authors = [{ name = "Suhrudh S", email = "suhrudhsarathy@gmail.com" }]
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "torch>=2.11",
    "torchvision",
    "torchcodec",
    "einops",
    "diffusers",
    "transformers",
    "hydra-core",
    "omegaconf",
    "wandb[media]",
    "tqdm",
    "pillow",
    "imageio",
    "matplotlib",
    "loguru",
    "lerobot[training]",
]

[project.optional-dependencies]
sim = [
    "metaworld @ git+https://github.com/SuhrudhSarathy/Metaworld.git@dev/multi-env",
    "gym-pusht",
    "pymunk==6.11.1",
    "mani-skill>=3.0.1",
    "pin; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit>=4.5.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
override-dependencies = ["mujoco>=3.3.7"]   # only if the sim extra still needs it

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E203", "E501", "B006", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]
"scripts/**" = ["E402"]
"src/savannah/tasks/abc.py" = ["E402"]   # MUJOCO_GL must be set before mujoco imports
