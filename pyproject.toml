[project]
name = "savannah"
version = "0.1.0"
description = "Robot Learning models in the wild"
authors = [{ name = "Suhrudh S", email = "suhrudhsarathy@gmail.com" }]
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "torch>=2.11",
    "torchvision",
    "torchcodec",
    "einops",
    "diffusers",
    "transformers",
    "huggingface_hub",
    "safetensors",
    "hydra-core",
    "omegaconf",
    "wandb[media]",
    "tqdm",
    "pillow",
    "imageio",
    "matplotlib",
    "loguru",
    "lerobot[training]",
]

[project.optional-dependencies]
sim = [
    "metaworld @ git+https://github.com/SuhrudhSarathy/Metaworld.git@dev/multi-env",
    "gym-pusht",
    "pymunk==6.11.1",
    "mani-skill>=3.0.1",
    "pin; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit>=4.5.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
override-dependencies = ["mujoco>=4.0"]   # metaworld pins mujoco==3.3.0; franka_sim needs >=4

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E203", "E501", "B006", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]
"scripts/**" = ["E402"]
"src/savannah/tasks/abc.py" = ["E402"]   # MUJOCO_GL must be set before mujoco imports
"tests/**/*abc*.py" = ["E402"]   # importorskip("abc_sim") must run before importing savannah.tasks.abc

# Test tiers are assigned by directory in tests/conftest.py; `-m ""` runs everything.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]   # tests/ for the shared tests/dummies.py
addopts = "--strict-markers -m 'not smoke and not integration and not sim'"
markers = [
    "smoke: short end-to-end training runs through scripts/*.py (tests/smoke)",
    "integration: real pretrained backbones / Hub datasets; downloads on first run",
    "sim: rollouts in real simulators (tests/eval)",
]
