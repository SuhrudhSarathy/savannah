[project]
name = "savannah"
version = "0.1.0"
description = "Robot Learning models in the wild"
authors = [
  {name = "Suhrudh S", email = "suhrudhsarathy@gmail.com"},
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "einops",
    "diffusers",
    "transformers",
    "hydra-core",
    "omegaconf",
    "wandb",
    "wandb[media]",
    "tqdm",
    "pillow",
    "imageio",
    "matplotlib",
    "lerobot",
    "lerobot[dataset]",
    "metaworld @ git+https://github.com/SuhrudhSarathy/Metaworld.git@dev/multi-env",
    "gym-pusht",
    "pymunk==6.11.1",
    "loguru",
    "mani-skill>=3.0.1",
    "pin; sys_platform == 'darwin'",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]
cu126 = [
    "torch",
    "torchvision",
]
cu130 = [
    "torch",
    "torchvision",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]   # looks for packages inside src/

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["E203", "E501", "B006"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
