# Template for multi_run.py
# Run: uv run python scripts/multi_run.py configs/experiments.yaml

vram_per_run_gb: 12

experiments:
  - name: dit_block_pusht
    overrides:
      - model=dit_block
      - trainer.artifact_name=dit_block_pusht
      - trainer.checkpoint_dir=checkpoints/dit_block_pusht

  - name: flow_matching_pusht
    overrides:
      - model=flow_matching
      - trainer.artifact_name=flow_matching_pusht
      - trainer.checkpoint_dir=checkpoints/flow_matching_pusht

  - name: unet_pusht
    overrides:
      - model=unet
      - trainer.artifact_name=unet_pusht
      - trainer.checkpoint_dir=checkpoints/unet_pusht
