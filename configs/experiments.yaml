# Template for multi_run.py
# Run: uv run python scripts/multi_run.py configs/experiments.yaml

vram_per_run_gb: 8  # estimated VRAM per training run; controls parallelism

experiments:
  - name: lr_high
    overrides:
      - trainer.lr=3e-4

  - name: lr_low
    overrides:
      - trainer.lr=1e-4

  - name: more_steps
    overrides:
      - trainer.lr=2e-4
      - trainer.training_steps=200000
