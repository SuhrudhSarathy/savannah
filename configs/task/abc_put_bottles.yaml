_target_: savannah.tasks.abc.ABCPutBottlesTask
config:
  _target_: savannah.data.dataset.DataSetConfig
  # Unused by ABCPutBottlesTask (it reads episode dirs directly, not a
  # LeRobot repo), but DataSetConfig.repo_id has no default.
  repo_id: abc/put_bottles
  root: /Users/suhrudh/abc/cache/train_sim
  fps: 30
  cameras: ["top", "left", "right"]
  image_size: 224 # matches abc's own DINO pipeline (resize_with_pad to 224x224)
  obs_horizon: 2
  action_horizon: ${model.action_horizon}
  batch_size: 1
  num_workers: 4
  use_language: false
  augmentation: ${augmentation}
