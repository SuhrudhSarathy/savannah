# model and task come from the checkpoint, so eval takes no model=/task= overrides.
pretrained: null # HF Hub repo id (suhrudhsarathy/unet_pusht) or local dir (checkpoints/unet_pusht)
subfolder: best_model # best_model | best_model_success | latest
revision: null # Hub branch / tag / commit, e.g. best_model-step-15000
use_ema: true # load the EMA weights instead of the raw training weights
num_episodes: 1
execute_steps: 16 # how many actions to execute per chunk (receding horizon)
video_folder: null # defaults to ./eval_videos/<name the checkpoint was trained under>
episode_index: 0 # which dataset episode to inspect (used by eval_single_episode.py)
pick_color: null # ManiSkill ColorMatching only: red/green/blue. If null, chosen randomly each episode.
place_color: null # ManiSkill ColorMatching only: red/green/blue. If null, chosen randomly each episode.
log_level: INFO # DEBUG | INFO | WARNING | ERROR

wandb:
  project: savannah
  enable_logging: false
