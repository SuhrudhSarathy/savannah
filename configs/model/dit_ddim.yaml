_target_: savannah.models.dit.DiTPolicy
embed_dim: 512
encoder_num_blocks: 4
encoder_num_attn_heads: '${eval: "max(4, ${model.embed_dim}//64)"}'
encoder_feedforward_dim: '${eval: "4 * ${model.embed_dim}"}'
encoder_dropout: 0.1
decoder_num_blocks: 4
decoder_num_attn_heads: '${eval: "max(4, ${model.embed_dim}//64)"}'
decoder_feedforward_dim: '${eval: "4 * ${model.embed_dim}"}'
decoder_dropout: 0.1
state_dim: 4
action_dim: 4
action_horizon: 20
num_cameras: ${len:${task.config.cameras}}
objective:
  _target_: savannah.objectives.DDIMObjective
  num_train_timesteps: 100
  num_inference_steps: 10
  beta_start: 1e-4
  beta_end: 0.02
  clip_sample: True
vision_encoder:
  _target_: savannah.models.encoders.vision_encoder.VisionEncoder
  embed_dim: ${model.embed_dim}
  backbone:
    _target_: savannah.models.backbones.dinov3_backbone.DinoV3Backbone
    image_size: ${task.config.image_size}
    base_model: facebook/dinov3-vits16-pretrain-lvd1689m
    use_eos_only: False
    trainable: False
language_encoder: null
