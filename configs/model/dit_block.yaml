_target_: savannah.models.dit_block_policy.DiTBlockPolicy
embed_dim: 128
num_blocks: 4
encoder_num_attn_heads: 4
encoder_feedforward_dim: 512
encoder_dropout: 0.1
decoder_num_attn_heads: 4
decoder_feedforward_dim: 512
decoder_dropout: 0.1
state_dim: 2
action_dim: 2
action_horizon: 8
num_cameras: 1
objective:
  _target_: savannah.objectives.DDIMObjective
  num_train_timesteps: 100
  num_inference_steps: 50
  beta_start: 1e-4
  beta_end: 0.02
  clip_sample: True
vision_encoder:
  _target_: savannah.models.vision_encoder.VisionEncoder
  embed_dim: ${model.embed_dim}
  backbone:
    _target_: savannah.models.backbones.resnet_backbone.ResNetBackbone
    out_channels: 96
