_target_: savannah.models.unet.UNetPolicy
embed_dim: 128
unet_channels: [256, 512, 1024]
num_residual_layers: 2
num_obs: ${task.config.obs_horizon}
state_dim: 2
action_dim: 2
action_horizon: 8
num_cameras: 1
objective:
  _target_: savannah.objectives.FlowMatchingObjective
  inference_steps: 10
vision_encoder:
  _target_: savannah.models.vision_encoder.VisionEncoder
  embed_dim: ${model.embed_dim}
  backbone:
    _target_: savannah.models.backbones.resnet_backbone.ResNetBackbone
    out_channels: 96
