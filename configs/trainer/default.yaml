train:
  lr: 1e-4
  vision_lr: 1e-5
  training_steps: 300000
  warmup_steps: 10000
  schedule: cosine
  gradient_accumulation_steps: 10
  ema_decay: 0.9999

eval:
  eval_freq: 2000
  eval_using_sim: false
  sim_eval_freq: 5000
  eval_episodes: 1
  eval_execute_steps: 8

checkpoint:
  checkpoint_dir: checkpoints/${name}
  artifact_name: ${name}
