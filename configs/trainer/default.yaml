train:
  lr: 1e-4
  weight_decay: 1e-2
  vision_lr: 1e-5
  training_steps: 75000
  warmup_steps: 1000
  schedule: constant
  gradient_accumulation_steps: 4
  ema_decay: 0.9999

eval:
  eval_freq: 5000
  eval_using_sim: true
  sim_eval_freq: 5000
  eval_episodes: 1
  eval_execute_steps: 16

checkpoint:
  checkpoint_dir: checkpoints/${name} # local: <dir>/{latest,best_model,best_model_success}/
  push_to_hub: false # push every checkpoint to the HF Hub (needs `hf auth login` or HF_TOKEN)
  hub_repo_id: suhrudhsarathy/${name} # one model repo per run, one subfolder per checkpoint
  hub_private: true
  resume_from: null # local checkpoint dir, e.g. checkpoints/<run>/latest
