train:
  lr: 1e-4
  weight_decay: 1e-6
  vision_lr: 1e-5
  training_steps: 100000
  warmup_steps: 1000
  schedule: cosine
  gradient_accumulation_steps: 1
  ema_decay: 0.9999

eval:
  eval_freq: 2000
  eval_using_sim: true
  sim_eval_freq: 5000
  eval_episodes: 1
  eval_execute_steps: 16

checkpoint:
  checkpoint_dir: checkpoints/${name}
  artifact_name: ${name}
  resume_from: null
