defaults:
  - model: dit_ddim
  - task: metaworld_hammer_multi_nail
  - augmentation: default
  - _self_

overfit:
  batch_size: 1
  image_size: ${task.config.image_size}
  steps: 2000
  lr: 1.0e-4
  log_every: 50
  loss_threshold: 0.01 # final loss must drop below this to count as a PASS
  action_mse_threshold: 0.05 # sampled-vs-ground-truth action MSE must drop below this to count as a PASS

log_level: INFO
